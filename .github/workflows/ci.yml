name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# Called runs use their caller's workflow name/event, so a release verification
# cannot cancel a normal CI run for the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

jobs:
  app:
    name: App quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and mocked integration tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=output/test-results/vitest.xml
      - name: Verify workflow policy
        run: npm run ci:policy
      - name: Lint workflow syntax and expressions
        run: npm run ci:lint
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: output/test-results/
          retention-days: 7
          if-no-files-found: warn

  backend:
    name: Backend and database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.6'
      - name: Edge Function type check
        run: npm run typecheck:functions
      - name: Type check and cache Edge Function test imports
        run: deno check --config supabase/functions/deno.json supabase/tests/usda_proxy_deno.mts supabase/tests/billing_deno.mts
      - name: PostgreSQL ownership and confirmation tests
        run: npm run test:db

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Audit dependencies against reviewed exceptions
        run: npm run ci:audit
      - name: Check tracked secret patterns
        if: always()
        run: node scripts/check-secrets.mjs
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: output/ci/audit.json
          retention-days: 7
          if-no-files-found: warn

  web:
    name: Web export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ci-fixture.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Expo web build
        run: npm run build:web
      - name: Check tracked and exported secret patterns
        run: node scripts/check-secrets.mjs --dist
      - name: Upload verified web export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-export
          path: dist/
          retention-days: 3
          if-no-files-found: error

  native:
    name: Native export (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ci-fixture.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Export native JavaScript bundle
        env:
          EXPORT_PLATFORM: ${{ matrix.platform }}
        run: npx expo export --platform "$EXPORT_PLATFORM" --output-dir "output/native/$EXPORT_PLATFORM"
      - name: Check tracked and native export secret patterns
        env:
          EXPORT_PLATFORM: ${{ matrix.platform }}
        run: node scripts/check-secrets.mjs --export-dir "output/native/$EXPORT_PLATFORM"
      - name: Upload native export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-export-${{ matrix.platform }}
          path: output/native/${{ matrix.platform }}/
          retention-days: 3
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.suite }})
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [web, auth, account, cookbook, motion, creation]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Download verified web export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-export
          path: dist/
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser suite
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        run: npm run ci:browser -- "$BROWSER_SUITE"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.suite }}
          path: output/playwright/
          retention-days: 7
          if-no-files-found: warn

  gate:
    name: Ready to merge
    if: always()
    needs: [app, backend, security, web, native, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          {
            printf '%s\n\n' '### Verification results'
            printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            printf '%s\n' '::error::A required verification job failed, was cancelled, or was skipped.'
            exit 1
          fi
